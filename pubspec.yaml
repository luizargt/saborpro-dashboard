name: saborpro_reports
description: SaborPro Analytics - Dashboard de reportes para gerentes
publish_to: 'none'
version: 1.1.4+16

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  # Mismas restricciones que Sabor Suite: ese set ya está probado contra estas
  # versiones de firebase_core/auth/firestore.
  firebase_messaging: ^16.0.4
  flutter_local_notifications: ^19.5.0

  # State Management
  provider: ^6.1.1

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  fl_chart: ^1.1.1
  lucide_icons: ^0.257.0

  # Utilities
  intl: ^0.20.2
  shared_preferences: ^2.2.2
  crypto: ^3.0.3
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  # Solo por openAppSettings(): es el paquete que Sabor Suite ya usa, así que no
  # se mete una dependencia distinta (app_settings) al ecosistema.
  permission_handler: ^11.3.1
  excel: ^4.0.6
  sentry_flutter: ^8.14.2
  shorebird_code_push: ^2.0.2

  # Aviso de actualización contra las tiendas. Mismas versiones que Sabor
  # Suite, que ya las tiene probadas en producción.
  package_info_plus: ^9.0.0
  url_launcher: ^6.3.2
  # Play Core: es la única forma oficial de preguntarle a Google Play si hay
  # una versión más nueva. Android no expone una API pública de versiones, y
  # raspar el HTML de la ficha se rompe cada vez que Google la cambia.
  in_app_update: ^4.2.5

  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  ios: true
  # Icono de app: version opaca. iOS rechaza iconos con canal alfa.
  image_path: "assets/images/SaborManager.png"
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/images/SaborManagerLogo.png"
  web:
    generate: true
    image_path: "assets/images/SaborManager.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - shorebird.yaml
